name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.x"
          - os: windows-latest
            node: "22.x"
          - os: macos-14
            node: "22.x"
          - os: ubuntu-latest
            node: "24.x"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run public-audit:release
      - run: node --experimental-sqlite bin/build-p10-release.mjs --output output/.ci-release
      - run: node --experimental-sqlite bin/build-p10-release.mjs --verify --output output/.ci-release
      - name: Verify Windows ZIP packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codex-work-platform-ci-windows-x64.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'codex-work-platform-ci-windows-x64-expanded'
          Compress-Archive -Path 'output/.ci-release/*' -DestinationPath $archive -CompressionLevel Optimal
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          node --experimental-sqlite bin/build-p10-release.mjs --verify --output $expanded

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
