name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-14
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/public-audit.mjs --release
      - run: node --experimental-sqlite bin/build-p10-release.mjs --output .ci-release
      - run: node --experimental-sqlite bin/build-p10-release.mjs --verify --output .ci-release
      - name: Package release (portable tarball)
        shell: bash
        run: |
          archive="codex-work-platform-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz"
          tar -czf "$archive" -C .ci-release .
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            codex-work-platform-${{ github.ref_name }}-${{ matrix.suffix }}.*

  publish:
    needs: [build, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
